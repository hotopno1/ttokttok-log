<style>
:root{--teal:#0F766E;--teal-d:#0B5953;--teal-s:#E6F2F0;--ink:#1A2421;--muted:#5B6763;--line:#DCE3E0;--bg:#F5F7F6;--or:#C2410C;--or-d:#9A3412;--or-s:#FDEEE6;--or-l:#F2C9B5;--yel-s:#FFF7E0;--yel-l:#EAD38A;--yel-d:#7A5A00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--teal)}a:hover{color:var(--teal-d)}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:13px}.b{font-weight:700}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--teal);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--teal-d);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}.btn.ghost:hover{border-color:#B8C6C1;color:var(--ink)}
.btn.line{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn.warn{background:var(--or)}.btn.warn:hover{background:var(--or-d)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;border:0}
.btn.big{min-height:60px;font-size:20px;border-radius:16px}
.link{background:none;border:0;padding:4px 0;color:var(--teal);font-weight:700;cursor:pointer}
.chip{min-height:44px;padding:6px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-align:left}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.drug{color:var(--or-d);border-color:var(--or-l)}.chip.drug.on{background:var(--or);border-color:var(--or);color:#fff}
.chip small{display:block;font-size:12px;font-weight:500;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.check{display:flex;align-items:flex-start;gap:10px;flex-wrap:nowrap;line-height:1.45;cursor:pointer}.check input[type=checkbox]{flex-shrink:0;width:18px;height:18px;margin:2px 0 0;accent-color:var(--teal)}
.tag{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.tag.t{background:var(--teal-s);border-color:var(--teal-s);color:var(--teal-d);font-weight:700}
.note{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}
.note.or{background:var(--or-s);color:var(--or-d)}.note.t{background:var(--teal-s);color:var(--teal-d)}.note.g{background:var(--bg)}.note.y{background:var(--yel-s);color:var(--yel-d);border:1px solid var(--yel-l)}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=password],select,textarea{height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;background:#fff;min-width:0}
textarea{height:auto;padding:10px 12px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink);font-size:16px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;color:var(--muted);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid #EEF2F0;vertical-align:top}
.scroll{overflow-x:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.tile .v{font-size:26px;font-weight:700}
/* teacher shell */
.top{background:#fff;border-bottom:1px solid var(--line)}
.top .in{max-width:1600px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;text-decoration:none;color:var(--ink)}
.nav{display:flex;flex-wrap:wrap;gap:4px;font-size:15px}
.nav a{padding:8px 12px;border-radius:10px;color:var(--ink);text-decoration:none}
.nav a.on{background:var(--teal-s);color:var(--teal-d);font-weight:700}
.wrap{max-width:1600px;margin:0 auto;padding:22px 24px 60px}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.c-q{flex:1 1 260px;min-width:0}.c-w{flex:999 1 560px;min-width:0}.c-h{flex:1 1 280px;min-width:0}
.qcard{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.qcard.cur{border-color:var(--teal)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:700;cursor:pointer}
.banner{background:var(--yel-s);border-bottom:1px solid var(--yel-l);color:var(--yel-d);font-size:14px;text-align:center;padding:6px 12px}
/* kiosk */
.k{min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.k-head{height:76px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:#fff;border-bottom:1px solid var(--line)}
.k-steps{display:flex;gap:26px;font-size:16px}.k-steps span{padding:6px 0;color:var(--muted)}.k-steps span.on{color:var(--teal);font-weight:700;border-bottom:3px solid var(--teal)}
.k-main{flex:1;display:flex;gap:28px;padding:26px 32px;min-height:0}
.k-foot{display:flex;justify-content:flex-end;gap:14px;padding:0 32px 10px;font-size:13px}
.k-foot button{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px}
.kbtn{border-radius:16px;font-size:24px;font-weight:700;cursor:pointer;background:#fff;border:2px solid var(--line);color:var(--ink)}
.kbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.knum{height:84px;border-radius:14px;cursor:pointer;background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.knum b{font-size:22px;line-height:1.1}.knum span{font-size:16px}
.knum.on{background:var(--teal);border-color:var(--teal);color:#fff}
.body{position:relative;width:230px;height:525px}
.part{position:absolute;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;background:#D5DDDA;color:#3F4A47}
.part.on{background:var(--teal);color:#fff}
/* 오늘 보건일지 표 */
table.log{width:100%;min-width:1100px;border-collapse:collapse;font-size:15px}
table.log th{background:var(--teal-s);color:var(--teal-d);font-weight:700;padding:9px 8px;border-bottom:2px solid #B9DAD4;text-align:left;white-space:nowrap}
table.log td{border-bottom:1px solid var(--line);padding:6px 6px;vertical-align:middle}
table.log td.c,table.log th.c{text-align:center}
table.log tr.hl td{background:#F2FAF8}
table.log tr.add td{background:#FAFBFB}
table.log .cell{cursor:pointer;line-height:1.9}
table.log .cell:hover{background:#F2FAF8}
table.log .cell.on{outline:2px solid var(--teal);outline-offset:-2px;background:#F2FAF8}
.cv{display:inline-flex;align-items:center;gap:2px;margin-right:10px;white-space:nowrap}
.cv.drug{color:var(--or-d);font-weight:700}
.cv .x{border:0;background:none;color:#D9534F;cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.ph{color:#A3B0AC}
.ico{border:0;background:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:4px;border-radius:8px}
.ico:hover{background:var(--bg);color:var(--ink)}
.ico.del:hover{color:#D9534F}
.tin{width:94px;height:34px;padding:0 6px;font-size:14px}
.min{height:34px;font-size:14px;min-width:90px}
.btn.sm{min-height:34px;padding:0 14px;font-size:14px;white-space:nowrap}
.chip.sm{min-height:36px;padding:0 12px;font-size:14px}
.pop{position:fixed;z-index:60;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:14px}
.pop.sx{width:560px;max-width:calc(100vw - 24px);overflow:auto}
/* 작은 달력 */
.minical{padding:12px 14px}
.minical .cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.minical .wh{font-size:12px;color:var(--muted);padding:2px 0}
.minical .cd{position:relative;border:0;background:none;font:inherit;font-size:13px;height:30px;border-radius:8px;cursor:pointer;color:var(--ink)}
.minical .cd:hover{background:var(--bg)}
.minical .cd.td{font-weight:900;color:var(--teal-d)}
.minical .cd.on{background:var(--teal);color:#fff}
.minical .cd i{position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--or)}
.minical .cd.on i{background:#fff}
.minical .sun{color:#D9534F}.minical .sat{color:#2F6FD0}.minical .cd.on.sun,.minical .cd.on.sat{color:#fff}
/* 요보호 표시 */
.flag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:#D9534F;border-radius:6px;padding:1px 6px;vertical-align:middle;line-height:1.5}
.flag.g{background:#C08A00}
/* V/S */
table.log .cell.vs{font-size:13px;color:var(--teal-d);font-weight:700}
.pop.vsp{width:420px;max-width:calc(100vw - 24px);overflow:auto}
.vsg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px}
.vsg .f{min-width:0}.vsg input{width:100%;min-width:0;height:40px}
/* 학생 추가 고르기 */
.pop.add{width:520px;max-width:calc(100vw - 24px);overflow:auto}
.pick{display:grid;gap:8px}.pick.g3{grid-template-columns:repeat(3,1fr)}.pick.g4{grid-template-columns:repeat(4,1fr)}.pick.g5{grid-template-columns:repeat(5,1fr)}
.pk{min-height:48px;border:2px solid var(--line);background:#fff;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.pk:hover{border-color:var(--teal);color:var(--teal-d)}
.pk.nm{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;line-height:1.25}
.pk.nm small{color:var(--muted);font-weight:400;font-size:12px}
.pop.tx{width:520px;max-width:calc(100vw - 24px);overflow:auto}
.pop .cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;align-content:start;width:270px;flex-shrink:0}
.pop .cat{border:0;background:none;text-align:left;padding:6px 8px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;white-space:nowrap}
.pop .cat:hover{background:var(--bg)}
.pop .cat.on{background:var(--teal);color:#fff;font-weight:700}
.pop .cat b{font-size:12px;color:var(--or-d)}
.pop .cat.on b{color:#fff}
.pop .checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;background:#fff;border-radius:10px;padding:8px 10px}
.pop .ck{display:flex;align-items:center;gap:6px;font-size:14px;cursor:pointer;padding:3px 0}
.pop .ck input{width:17px;height:17px;accent-color:var(--teal)}
.call{min-height:100vh;background:var(--teal);color:#fff;display:flex;flex-direction:column;padding:36px 52px}
/* 마우스 올렸을 때 */
.btn,.chip,.kbtn,.knum,.part,.qcard,.nav a,.link,.stepper button,.k-foot button,.card,.tag,table.t tbody tr td{transition:background-color .12s,border-color .12s,color .12s,box-shadow .12s,transform .12s}
[data-tip]{position:relative}
.part[data-tip]{position:absolute}
@media (hover:hover){
  .btn:not(:disabled):hover{box-shadow:0 2px 8px rgba(15,118,110,.22)}
  .btn.warn:not(:disabled):hover{box-shadow:0 2px 8px rgba(194,65,12,.25)}
  .btn.line:hover{background:var(--teal-s);color:var(--teal-d)}
  .chip:not(.on):hover{border-color:#8FBFB7;background:var(--teal-s)}
  .chip.on:hover{background:var(--teal-d);border-color:var(--teal-d)}
  .chip.drug:not(.on):hover{border-color:var(--or);background:var(--or-s)}
  .chip.drug.on:hover{background:var(--or-d);border-color:var(--or-d)}
  .kbtn:not(.on):not(:disabled):hover,.knum:not(.on):hover{border-color:#8FBFB7;background:var(--teal-s)}
  .kbtn.on:hover,.knum.on:hover{background:var(--teal-d);border-color:var(--teal-d)}
  .part:not(.on):hover{background:#BCC9C5;color:var(--ink)}
  .part.on:hover{background:var(--teal-d)}
  .qcard:not(.cur):hover{border-color:#8FBFB7;box-shadow:0 2px 10px rgba(26,36,33,.07)}
  .nav a:not(.on):hover{background:var(--bg);color:var(--ink)}
  .link:hover{text-decoration:underline;text-underline-offset:3px}
  .stepper button:hover{border-color:#8FBFB7;background:var(--teal-s)}
  .k-foot button:hover{color:var(--ink)}
  a.card:hover{border-color:var(--teal);box-shadow:0 4px 16px rgba(15,118,110,.12)}
  table.t tbody tr:hover td{background:#F7FAF9}
  .heat td[data-tip]:hover{outline:2px solid var(--ink);outline-offset:-2px}
  .bar:hover .fl{background:var(--teal-d)}
  .monthbar:hover .mb{background:#5BAEA1}
  .monthbar[aria-pressed=true]:hover .mb{background:var(--teal-d)}
  [data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:500;line-height:1.4;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:40;pointer-events:none;text-align:left}
  [data-tip-pos=bottom]:hover::after{bottom:auto;top:calc(100% + 8px)}
  [data-tip-pos=left]:hover::after{left:auto;right:0;transform:none}
}
@media (max-width:900px){.k-main{flex-direction:column}.k-steps{display:none}}
@media print{.noprint{display:none!important}body,html{background:#fff}.wrap{padding:0;max-width:none}.card{border:0;padding:0}}
@page{size:A4 landscape;margin:12mm}
.printsheet{background:#fff;color:#111}
.printsheet table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.4}
.printsheet th,.printsheet td{border:1px solid #555;padding:6px 5px}
.printsheet th{background:#EEF2F0}
.modalbg{position:fixed;inset:0;background:rgba(26,36,33,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:18px;padding:22px 24px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:60}
.heat td{text-align:center;border-radius:4px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 56px;align-items:center;gap:10px;font-size:14px}
.bar .tr{height:14px;background:#EEF2F0;border-radius:0 4px 4px 0}.bar .fl{height:14px;background:var(--teal);border-radius:0 4px 4px 0}
</style>

<script>
'use strict';
const VERSION = '0.7.0';
// 만든 사람 (공동 작업) — 이어 만드는 선생님 이름을 이 목록에 더하면 첫 화면·설정 아래에 함께 보여요
const CREDITS = ['음악적체육인'];
const creditText = () => '만든 사람 ' + CREDITS.join(' · ');
// 둘러보기 모드: 비밀번호를 만들기 전에 화면·기능을 시험해요. 클라우드에 올리지 않고 이 기기에만 따로 저장해요
const DEMO = (() => { try { return localStorage.getItem('knock.demo') === '1'; } catch (e) { return false; } })();
const KEY = DEMO ? 'knock.demo.v1' : 'knock.v1';

/* ---------- 작은 도구 ---------- */
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now();
const pad = (n) => String(n).padStart(2, '0');
const hm = (t) => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const ymd = (t) => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const kdate = (t) => { const d = new Date(t); return d.getFullYear() + '. ' + (d.getMonth() + 1) + '. ' + d.getDate() + '.'; };
const kexp = (s) => { if (!s) return ''; const [y, m] = s.split('-'); return `${y}년 ${Number(m)}월`; };
const monthEnd = (ym) => { if (!ym) return ''; if (/^\d{4}-\d{2}-\d{2}$/.test(ym)) return ym; const [y, m] = ym.split('-').map(Number); return `${ym}-${String(new Date(y, m, 0).getDate()).padStart(2, '0')}`; };
const kbuy = (s) => { if (!s) return ''; const [y, m, d] = s.split('-'); return `${y}. ${Number(m)}. ${Number(d)}.`; };
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const schoolYear = (t) => { const d = new Date(t); return d.getMonth() + 1 >= 3 ? d.getFullYear() : d.getFullYear() - 1; };
const mask = (n) => { n = String(n || ''); if (n.length <= 1) return n; if (n.length === 2) return n[0] + '*'; return n[0] + '*'.repeat(n.length - 2) + n[n.length - 1]; };
const daysLeft = (exp) => Math.round((new Date(exp + 'T00:00:00') - new Date(ymd(now()) + 'T00:00:00')) / 86400000);
const sum = (a) => a.reduce((x, y) => x + y, 0);
const uniq = (a) => [...new Set(a)];

const SYMBOL = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 300 300" aria-hidden="true"><circle cx="125" cy="150" r="95" fill="#0F766E"/><path d="M125 99V201M74 150H176" stroke="#fff" stroke-width="32" stroke-linecap="round"/><path d="M216 82A120 120 0 0 1 216 218M246 57A150 150 0 0 1 246 243" fill="none" stroke="#E07A3F" stroke-width="16" stroke-linecap="round"/></svg>`;

/* ---------- 기본 자료 ---------- */
const SYM = {
  head: '머리가 아파요', fever: '열이 나요', dizzy: '어지러워요', nose: '코피가 나요', eye: '눈이 아파요', tooth: '이가 아파요',

function placePop() {

  const cell = document.querySelector(T.pop.kind === 'add' ? '[data-cell="add"]' : `[data-cell="${T.pop.vid}|${T.pop.kind}"]`); if (!cell) return;
  const r = cell.getBoundingClientRect(); const w = p.offsetWidth, h = p.offsetHeight;
  let left = Math.min(r.left, window.innerWidth - w - 12); left = Math.max(12, left);
  const below = window.innerHeight - r.bottom - 14, above = r.top - 14;
  let top, maxH;
  if (h <= below || below >= above) { top = r.bottom + 6; maxH = below; } else { maxH = above; top = Math.max(8, r.top - 6 - Math.min(h, maxH)); }
  p.style.maxHeight = Math.max(220, maxH) + 'px';
  p.style.left = left + 'px'; p.style.top = top + 'px';
}

function yearData(y) {
  if (Number(y) === S.school.year) return { visits: S.visits.filter((v) => v.status === 'done'), roster: S.roster };
  const ar = S.archives.find((a) => a.year === Number(y)); return ar ? { visits: ar.visits.filter((v) => v.status === 'done'), roster: ar.roster } : { visits: [], roster: [] };
}
const MONTHS = ['3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월', '1월', '2월'];
const mIndex = (t) => (new Date(t).getMonth() + 10) % 12;
function statsOf(y, grade) {
  const { visits } = yearData(y);
  const vs = visits.filter((v) => grade === 'all' || String((v.snap || {}).grade) === String(grade));
  const mat = Object.fromEntries(CATS.map((c) => [c, Array(12).fill(0)]));
  const monthTot = Array(12).fill(0); const symByMonth = Array(12).fill(0).map(() => ({}));
  const care = {}; const grades = {}; const labCat = {};
  vs.forEach((v) => {
    const mi = mIndex(v.at); const cat = catOf(v);
    mat[cat][mi]++; monthTot[mi]++;
    symLabels(v).forEach(([l, c]) => { symByMonth[mi][l] = (symByMonth[mi][l] || 0) + 1; labCat[l] = c; });
    [...(v.cares || []), ...(v.custom || [])].forEach((c) => { care[c] = (care[c] || 0) + 1; });
    if ((v.drugs || []).length) care['투약'] = (care['투약'] || 0) + 1;
    const g = (v.snap || {}).grade; if (g) grades[g] = (grades[g] || 0) + 1;
  });
  return { vs, mat, monthTot, symByMonth, care, grades, labCat };
}

  modalOk: () => { const i = document.getElementById('modalIn'); const v = i ? i.value : true; document.getElementById('overlay').innerHTML = ''; if (modalResolve) modalResolve(v); },
  modalNo: () => { document.getElementById('overlay').innerHTML = ''; if (modalResolve) modalResolve(null); },
  setupStart: () => { const n = document.getElementById('setupName').value.trim(); if (!n) { toast('학교 이름을 넣어 주세요'); return; } S.school.name = n; save(); go('start'); },
  setupSample: () => { const n = document.getElementById('setupName').value.trim(); S = sampleData(n); save(); toast('예시 자료를 넣었어요'); go('start'); },
  unlock: () => { const v = document.getElementById('pinIn').value; if (v === S.settings.pin) { try { sessionStorage.setItem('knockUnlocked', '1'); } catch (e) {} render(); } else toast('번호가 달라요'); },
  // 학생 화면
  kSound: () => { ensureAudio(); render(); if (K.sound) { const was = S.settings.chime; S.settings.chime = true; chime(); S.settings.chime = was; } },
  kFull: () => { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); } catch (e) { toast('이 화면에서는 전체 화면을 쓸 수 없어요'); } },
  codeKey: (k) => {
    K.codeErr = ''; K.codeIn = K.codeIn || '';
    if (k === 'del') K.codeIn = K.codeIn.slice(0, -1);
    else if (k === 'ok') {
      if (K.codeIn.length !== 6) { K.codeErr = '6자리를 모두 눌러 주세요'; }
      else if (S.school.name && K.codeIn === S.school.code) { ls.set('knockKioskCode', K.codeIn); K.codeIn = ''; location.replace('#kiosk-' + S.school.code); kioskGate(); }
      else { K.codeErr = S.school.name ? '학교 코드가 맞지 않아요' : '이 기기에 학교 자료가 없어요 · 이 판은 선생님 화면과 같은 기기에서만 이어져요'; K.codeIn = ''; }
    } else if (K.codeIn.length < 6) K.codeIn += k;
    render();
  },
  copyKiosk: async () => { try { await navigator.clipboard.writeText(kioskUrl()); toast('주소를 복사했어요'); } catch (e) { toast('복사하지 못했어요 · 주소를 직접 골라 복사해 주세요'); } },
  newKioskCode: async () => { const ok = await ask('학교 코드를 바꿀까요?', '지금 연결된 태블릿은 새 코드를 다시 넣어야 열려요. 코드가 학생에게 알려졌을 때 써요.', '바꾸기', true); if (!ok) return; S.school.code = newCode(); save(); render(); },
  kGrade: (a) => { K.grade = Number(a); K.cls = null; K.sid = null; render(); },
  kCls: (a) => { K.cls = Number(a); K.sid = null; render(); },
  kKid: (a) => { K.sid = a; render(); },
  kReset: () => { resetKiosk(); render(); },
  kToWhere: () => { if (!K.sid) return; K.step = 'where'; render(); },
  kBack: () => { K.step = 'who'; render(); },
  kPart: (a) => { K.parts[a] = !K.parts[a]; render(); },
  kSym: (a) => { K.sym[a] = !K.sym[a]; render(); },
  kSince: (a) => { K.since = a; render(); },
  kSubmit: () => {
    const st = student(K.sid); if (!st) return;
    if (presence().away) { toast('지금은 접수를 받지 않아요'); render(); return; }
    const picked = Object.keys(K.parts).filter((k) => K.parts[k]); const syms = allowedSyms(picked).filter((s) => K.sym[s]); if (!syms.length) return;
    const v = { id: uid(), sid: st.id, snap: snap(st), at: now(), parts: picked, sym: syms, since: K.since, status: 'wait' };
    S.visits.push(v); save(); K.lastVid = v.id; K.step = 'done'; K.doneAt = now(); render();
  },
  kCloseCall: () => { S.call = null; save(); render(); },
  // 선생님
  callNext: () => { const n = queue().find((x) => x.status === 'wait'); if (!n) return; A.callThis(n.id); },
  callThis: (id) => { const v = S.visits.find((x) => x.id === id); if (!v) return; T.logDate = ymd(now()); T.calM = null; startRow(v); S.call = { vid: v.id, at: now() }; save(); render(); toast(`${(v.snap || {}).name} 학생을 불렀어요`); },
  recall: () => { const v = S.call && S.visits.find((x) => x.id === S.call.vid); if (!v) return; S.call = { vid: v.id, at: now() }; save(); toast('다시 불렀어요'); },
  // 표에 학생 바로 추가
  addRow: (sid) => { const st = student(sid); if (!st) return; const atT = (() => { if (logDay() === ymd(now())) return now(); const d = new Date(logDay() + 'T00:00:00'); const n = new Date(); d.setHours(n.getHours(), n.getMinutes(), 0, 0); return d.getTime(); })(); const v = { id: uid(), sid: st.id, snap: snap(st), at: atT, parts: [], sym: [], since: '', status: 'wait' }; startRow(v); S.visits.push(v); T.addQ = ''; T.pop = { vid: v.id, kind: 'sx', cat: SX_CATS[0] }; save(); render(); },
  logDate: (d) => { T.logDate = d; T.calM = d.slice(0, 7); T.pop = null; T.histPop = null; render(); },
  logShift: (n) => { const t = new Date(logDay() + 'T12:00:00'); t.setDate(t.getDate() + Number(n)); A.logDate(ymd(t.getTime())); },
  logToday: () => A.logDate(ymd(now())),
  calMove: (n) => { const [y, m] = (T.calM || logDay().slice(0, 7)).split('-').map(Number); const t = new Date(y, m - 1 + Number(n), 1); T.calM = `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}`; render(); },
  printDay: () => { T.printDate = logDay(); go('print'); },
  slip: (vid) => { const v = S.visits.find((x) => x.id === vid); if (!v) return; if (!v.doneAt) { const d = new Date(v.at); const n = new Date(); d.setHours(n.getHours(), n.getMinutes(), 0, 0); v.doneAt = ymd(v.at) === ymd(now()) ? now() : d.getTime(); save(); render(); } printSlip(v); },
  // 요보호
  spPick: (d) => { T.sp.disease = T.sp.disease ? (T.sp.disease.split(',').map((x) => x.trim()).includes(d) ? T.sp.disease : T.sp.disease + ', ' + d) : d; render(); },
  spSave: () => {
    const P = T.sp; const st = student(P.sid); P.disease = (P.disease || '').trim();
    if (!P.editId && !st) { toast('학생을 골라 주세요'); return; }
    if (!P.disease) { toast('질환을 적어 주세요'); return; }
    S.special = S.special || [];
    if (P.editId) { const x = S.special.find((y) => y.id === P.editId); if (x) Object.assign(x, { disease: P.disease, status: P.status, manage: (P.manage || '').trim(), upd: now() }); toast('고쳤어요'); }
    else { S.special.push({ id: uid(), sid: st.id, snap: snap(st), disease: P.disease, status: P.status, manage: (P.manage || '').trim(), at: now() }); toast(`${st.name} 학생을 등록했어요`); }
    T.sp = { grade: P.grade, cls: P.cls, sid: '', disease: '', status: '치료 중', manage: '', editId: null }; save(); render();
  },
  spEdit: (id) => { const x = (S.special || []).find((y) => y.id === id); if (!x) return; const st = student(x.sid) || x.snap || {}; T.sp = { grade: st.grade, cls: st.cls, sid: x.sid, disease: x.disease, status: x.status || '치료 중', manage: x.manage || '', editId: x.id }; render(); window.scrollTo(0, 0); },
  spTemplate: () => writeBook('똑똑_요보호학생_양식.xlsx', { '요보호 학생': [['학년', '반', '번호', '이름', '질환', '치료 상태', '관리 방법'], [1, 1, 1, '김하늘', '천식', '치료 중', '흡입기 가방 앞주머니 지참, 발작 시 흡입기 사용 후 보호자 연락'], [1, 1, 1, '김하늘', '땅콩 알레르기', '경과 관찰', '급식 땅콩 메뉴 확인']] }),
  spImportCancel: () => { T.spImport = null; render(); },
  spImportApply: () => {
    const I = T.spImport; if (!I) return; S.special = S.special || []; let add = 0, upd = 0;
    I.ok.forEach((r) => { const ex = S.special.find((x) => x.sid === r.st.id && x.disease === r.disease); if (ex) { Object.assign(ex, { status: r.status, manage: r.manage, upd: now() }); upd++; } else { S.special.push({ id: uid(), sid: r.st.id, snap: snap(r.st), disease: r.disease, status: r.status, manage: r.manage, at: now() }); add++; } });
    T.spImport = null; save(); render(); toast(`${add}건 등록${upd ? ` · ${upd}건 고침` : ''}`);
  },
  spCancel: () => { T.sp = null; render(); },
  spDel: async (id) => { const x = (S.special || []).find((y) => y.id === id); if (!x) return; const st = student(x.sid) || x.snap || {}; if (!(await ask('요보호 등록을 지울까요?', `<b>${esc(st.name || '')}</b> 학생의 '${esc(x.disease)}' 기록을 지워요.`, '지우기', true))) return; S.special = S.special.filter((y) => y.id !== id); save(); render(); },
  // 설정: 계통별 처치
  cbCatSet: (c) => { T.cbCat = c; render(); },
  cbAdd: () => { const i = document.getElementById('cbNew'); const t = (i.value || '').trim(); if (!t) return; const c = T.cbCat || SX_CATS[0]; S.careByCat = S.careByCat || JSON.parse(JSON.stringify(CARE_BY_CAT)); S.careByCat[c] = uniq([...(S.careByCat[c] || []), t]); save(); render(); },
  cbDel: (i) => { const c = T.cbCat || SX_CATS[0]; S.careByCat = S.careByCat || JSON.parse(JSON.stringify(CARE_BY_CAT)); S.careByCat[c].splice(Number(i), 1); save(); render(); },
  openAdd: () => { T.histPop = null; T.pop = T.pop && T.pop.kind === 'add' ? null : { kind: 'add', grade: null, cls: null }; render(); },
  addGrade: (g) => { T.pop = { kind: 'add', grade: g ? Number(g) : null, cls: null }; render(); },
  addCls: (c) => { T.pop.cls = Number(c); render(); },
  addFirst: () => { const c = addCandidates(document.getElementById('addIn')?.value || T.addQ)[0]; if (c) A.addRow(c.id); },
  // 고르는 창
  openPop: (a) => { const [vid, kind] = a.split('|'); if (T.pop && T.pop.vid === vid && T.pop.kind === kind) { T.pop = null; render(); return; } const v = S.visits.find((x) => x.id === vid); T.histPop = null; T.pop = { vid, kind, cat: (v && v.sx && v.sx[0] && v.sx[0].c) || SX_CATS[0] }; render(); setTimeout(() => document.getElementById('popIn')?.focus({ preventScroll: true }), 30); },
  popClose: () => { T.pop = null; render(); },
  popCat: (c) => { T.pop.cat = c; render(); },
  popAdd: () => {
    const el = document.getElementById('popIn'); const t = (el?.value || '').trim(); if (!t || !T.pop) return;
    const v = S.visits.find((x) => x.id === T.pop.vid); if (!v) return;
    if (T.pop.kind === 'sx') { v.sx = v.sx || []; if (!v.sx.some((x) => x.t === t)) v.sx.push({ c: T.pop.cat || '기타', t }); }
    else { v.custom = v.custom || []; if (!v.custom.includes(t) && !(v.cares || []).includes(t)) v.custom.push(t); }
    el.value = ''; save(); render();
  },
  sxToggle: (a) => { const v = S.visits.find((x) => x.id === T.pop.vid); if (!v) return; const i = a.indexOf('|'); const c = a.slice(0, i), t = a.slice(i + 1); v.sx = v.sx || []; const k = v.sx.findIndex((x) => x.c === c && x.t === t); if (k >= 0) v.sx.splice(k, 1); else v.sx.push({ c, t }); save(); render(); },
  sxDel: (a) => { const [vid, j] = a.split('|'); const v = S.visits.find((x) => x.id === vid); if (!v || !v.sx) return; v.sx.splice(Number(j), 1); save(); render(); },
  txCare: (c) => { const v = S.visits.find((x) => x.id === T.pop.vid); if (!v) return; v.cares = v.cares || []; const k = v.cares.indexOf(c); if (k >= 0) v.cares.splice(k, 1); else v.cares.push(c); save(); render(); },
  txDrug: (id) => {
    const v = S.visits.find((x) => x.id === T.pop.vid); const d = S.drugs.find((x) => x.id === id); if (!v || !d) return;
    v.drugs = v.drugs || []; const u = v.drugs.find((x) => x.id === id);
    if (u) v.drugs = v.drugs.filter((x) => x.id !== id);
    else v.drugs.push({ id: d.id, name: d.name });
    save(); render();
  },
  txDel: (a) => {
    const [vid, kind, k] = a.split('|'); const v = S.visits.find((x) => x.id === vid); if (!v) return;
    if (kind === 'c') v.cares.splice(Number(k), 1);
    if (kind === 'u') v.custom.splice(Number(k), 1);
    if (kind === 'd') v.drugs = (v.drugs || []).filter((x) => x.id !== k);
    save(); render();
  },
  vOut: (vid) => { const v = S.visits.find((x) => x.id === vid); if (!v) return; v.doneAt = now(); save(); render(); },
  vDel: async (vid) => {
    const v = S.visits.find((x) => x.id === vid); if (!v) return;
    const ok = await ask('이 기록을 지울까요?', `<b>${esc((v.snap || {}).name || '')}</b> 학생의 오늘 기록을 지워요.`, '지우기', true); if (!ok) return;
    v.status = 'cancel'; if (T.pop && T.pop.vid === vid) T.pop = null; save(); render();
  },
  histPop: (vid) => { T.pop = null; T.histPop = T.histPop === vid ? null : vid; render(); },
  histPopClose: () => { T.histPop = null; render(); },
  walkOpen: () => { T.walk = T.walk ? null : { grade: '', cls: '', sid: '', sym: '' }; render(); },
  walkClose: () => { T.walk = null; render(); },
  walkAdd: () => { const w = T.walk; const st = student(w.sid); if (!st || !w.sym) { toast('학생과 증상을 골라 주세요'); return; } const v = { id: uid(), sid: st.id, snap: snap(st), at: now(), parts: [], sym: [w.sym], since: 'now', status: 'called', calledAt: now() }; S.visits.push(v); T.cur = v.id; T.walk = null; save(); render(); },
  openHist: (sid) => { T.histSid = sid; T.histTab = 'all'; go('history'); },
  histBack: () => { T.histSid = null; render(); },
  histTab: (a) => { T.histTab = a; render(); },
  toKioskCard: () => { go('config'); setTimeout(() => { const el = document.getElementById('kioskCard'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 60); },
  toggleApproval: () => { S.settings.approval = !S.settings.approval; save(); render(); },
  doPrint: () => { try { window.print(); } catch (e) { toast('이 화면에서는 인쇄할 수 없어요'); } },
  // 약품
  intakeMode: (a) => { T.intake = a; render(); },
  intakeOne: () => { const d = S.drugs.find((x) => x.id === T.form.drug) || S.drugs[0]; const q = parseInt(T.form.qty, 10); if (!d || !q || !T.form.exp) { toast('양과 유통기한을 적어 주세요'); return; } const buy = T.form.buy || ymd(now()); const exp = monthEnd(T.form.exp); d.lots.push({ id: uid(), buy, exp, qty: q, loc: T.form.loc.trim() }); S.stockLog.unshift({ at: now(), did: d.id, name: d.name, delta: q, qtyText: q + d.unit, note: `입고 · ${kbuy(buy)} 구입 · ${kexp(exp)}까지${T.form.loc ? ' · ' + T.form.loc : ''}` }); T.form.qty = ''; T.form.loc = ''; save(); render(); toast(`${d.name} ${q}${d.unit} 입고했어요`); },
  lotOut: async (a) => { const [did, lid] = a.split('|'); const d = S.drugs.find((x) => x.id === did); const l = d && d.lots.find((x) => x.id === lid); if (!l) return; const v = await ask('빼기', `다 쓰거나 버린 양을 빼요. ${esc(d.name)} ${kexp(l.exp)}까지 묶음에서 뺄 양을 적어 주세요 (지금 ${l.qty}${esc(d.unit)}). 다 빼려면 그대로 두세요.`, '빼기', true, { ph: String(l.qty), mode: 'numeric' }); if (v === null) return; const q = Math.min(l.qty, parseInt(v, 10) || l.qty); l.qty -= q; d.lots = d.lots.filter((x) => x.qty > 0); S.stockLog.unshift({ at: now(), did: d.id, name: d.name, delta: -q, qtyText: q + d.unit, note: '빼기 · ' + kexp(l.exp) + '까지 묶음' }); save(); render(); },
  newDrug: () => { T.newDrug = { id: uid(), name: '', kind: '', unit: '개', min: 0, counted: false, syms: [], lots: [] }; T.editDrug = null; render(); },
  editDrug: (id) => { T.editDrug = id; T.newDrug = null; T._draft = JSON.parse(JSON.stringify(S.drugs.find((d) => d.id === id))); render(); },
  dCounted: () => { const d = T.newDrug || T._draft; d.counted = !d.counted; },
  dCat: (c) => { const d = T.newDrug || T._draft; d.cats = d.cats || autoCats(d.name); d.cats = d.cats.includes(c) ? d.cats.filter((x) => x !== c) : [...d.cats, c]; render(); },
  dSym: (s) => { const d = T.newDrug || T._draft; d.syms = d.syms.includes(s) ? d.syms.filter((x) => x !== s) : [...d.syms, s]; syncDraftView(); },
  dSave: () => { const d = T.newDrug || T._draft; if (!d.name.trim()) { toast('약 이름을 적어 주세요'); return; } d.min = parseInt(d.min, 10) || 0; if (!d.cats) d.cats = autoCats(d.name); if (T.newDrug) S.drugs.push(d); else { const i = S.drugs.findIndex((x) => x.id === d.id); S.drugs[i] = d; } T.newDrug = null; T.editDrug = null; save(); render(); },
  dCancel: () => { T.newDrug = null; T.editDrug = null; render(); },
  dDelete: async () => { const d = T._draft; const ok = await ask('이 약을 지울까요?', `${esc(d.name)}와 남은 재고 기록이 목록에서 사라져요. 지난 처치 기록에 적힌 약 이름은 그대로 남아요.`, '지우기', true); if (!ok) return; S.drugs = S.drugs.filter((x) => x.id !== d.id); T.editDrug = null; save(); render(); },
  purUse: (i) => { T.pur.rows[i].use = !T.pur.rows[i].use; render(); },
  purCancel: () => { T.pur = null; render(); },
  purImport: () => {
    const rows = T.pur.rows.filter((r) => r.use);
    if (rows.some((r) => !r.exp)) { toast('유통기한을 모두 적어 주세요'); return; }
    const buy = T.pur.buy || ymd(now());
    rows.forEach((r) => { let d = S.drugs.find((x) => x.id === r.match); if (!d) { d = { id: uid(), name: r.item, kind: r.spec || '', unit: r.unit || '개', min: 0, counted: false, cats: autoCats(r.item), syms: [], lots: [] }; S.drugs.push(d); } const q = parseInt(r.into, 10) || 0; if (!q) return; const exp = monthEnd(r.exp); d.lots.push({ id: uid(), buy, exp, qty: q, loc: r.loc }); S.stockLog.unshift({ at: now(), did: d.id, name: d.name, delta: q, qtyText: q + d.unit, note: `품의서 입고 · ${kbuy(buy)} 구입 · ${kexp(exp)}까지${r.loc ? ' · ' + r.loc : ''}` }); });
    S.settings.purMap = { hdrText: (T.pur.aoa[T.pur.hdr] || []).join('|'), cols: T.pur.cols }; T.pur = null; save(); render(); toast(`${rows.length}가지를 입고했어요. 맞는 증상 계통은 약 이름으로 짐작해 넣었어요 · '고치기'에서 바꿀 수 있어요`);
  },
  // 통계
  statMonth: (i) => { T.statMonth = Number(i); render(); },
  statXlsx: () => { const y = T.statYear || S.school.year; const { visits, roster } = yearData(y); writeBook(`${y}학년도_보건실통계_${S.school.name}.xlsx`, yearBook(y, visits, roster, true)); },
  // 설정
  cfgToggle: (k) => { S.settings[k] = !S.settings[k]; save(); },
  careSym: (s) => { T.careSym = s; render(); },
  sxCatSet: (c) => { T.sxCat = c; render(); },
  sxItemAdd: () => { const i = document.getElementById('sxNew'); const t = (i.value || '').trim(); if (!t) return; const c = T.sxCat || SX_CATS[0]; S.sxList = S.sxList || JSON.parse(JSON.stringify(SX_DEFAULT)); S.sxList[c] = uniq([...(S.sxList[c] || []), t]); save(); render(); },
  sxItemDel: (i) => { const c = T.sxCat || SX_CATS[0]; S.sxList = S.sxList || JSON.parse(JSON.stringify(SX_DEFAULT)); S.sxList[c].splice(Number(i), 1); save(); render(); },
  sxReset: async () => { if (!(await ask('증상 목록을 처음으로 되돌릴까요?', '더하거나 지운 증상이 모두 처음 목록으로 바뀌어요. 이미 적은 기록은 그대로예요.', '되돌리기', true))) return; S.sxList = JSON.parse(JSON.stringify(SX_DEFAULT)); save(); render(); },
  cqAdd: () => { const i = document.getElementById('cqNew'); const t = (i.value || '').trim(); if (!t) return; S.careQuick = uniq([...careQuick(), t]); save(); render(); },
  cqDel: (i) => { S.careQuick = careQuick().slice(); S.careQuick.splice(Number(i), 1); save(); render(); },
  careAdd: () => { const i = document.getElementById('careNew'); const t = i.value.trim(); if (!t) return; S.careCustom[T.careSym] = uniq([...(S.careCustom[T.careSym] || []), t]); save(); render(); },
  careDel: (i) => { S.careCustom[T.careSym].splice(Number(i), 1); save(); render(); },
  rosterTemplate: () => writeBook('똑똑_명렬표_양식.xlsx', { '명렬표': [['학년', '반', '번호', '이름', '주의 메모'], [1, 1, 1, '김하늘', '']] }),
  rosterApply: () => { S.roster = T.rosterPreview.list; T.rosterPreview = null; save(); render(); toast('명단을 바꿨어요'); },
  rosterCancel: () => { T.rosterPreview = null; render(); },
  backup: () => download(`똑똑_백업_${ymd(now())}.json`, new Blob([JSON.stringify(S)], { type: 'application/json' })),
  wipe: async () => { const v = await ask('모든 자료를 지울까요?', '명단, 기록, 약품, 설정이 <b>연결된 모든 기기와 클라우드에서</b> 사라지고 되돌릴 수 없어요. 확인을 위해 <b>지우기</b>라고 적어 주세요.', '모두 지우기', true, { ph: '지우기' }); if (v !== '지우기') { if (v !== null) toast('글자가 달라서 지우지 않았어요'); return; } S = blankState(); save(); go('start'); },
  // 마감
  yeNoPhone: () => { T.ye.noPhone = !T.ye.noPhone; },
  yeDownload: () => { writeBook(`${S.school.year}학년도_보건실기록_${S.school.name}.xlsx`, yearBook(S.school.year, S.visits, S.roster, T.ye.noPhone)); },
  yeClose: async () => {
    const y = S.school.year; if (T.ye.typed.trim() !== `${y} 마감`) return;
    const ok = await ask(`${y}학년도를 마감할까요?`, `마감 파일을 내려받고, 명단과 올해 기록을 '지난 학년도'로 옮긴 뒤 ${y + 1}학년도를 시작해요.`, '마감하기', true); if (!ok) return;
    A.yeDownload();
    const roster = S.roster.map((s) => { const c = { ...s }; delete c.guardians; return c; });
    S.archives.push({ year: y, closedAt: now(), roster, visits: S.visits.filter((v) => v.status === 'done') });
    S.school.year = y + 1; S.roster = []; S.visits = []; S.call = null; T.ye.typed = ''; save(); render(); toast(`${y + 1}학년도를 시작했어요. 설정에서 새 명렬표를 올려 주세요`);
  },
  arDownload: (y) => { const ar = S.archives.find((a) => a.year === Number(y)); if (ar) writeBook(`${ar.year}학년도_보건실기록_${S.school.name}.xlsx`, yearBook(ar.year, ar.visits, ar.roster, true)); }
};
const CH = {
  setPlace: (el) => { S.override = { place: el.value, until: el.value === 'auto' || el.value === 'room' ? '' : (S.override.until || '') }; save(); render(); },
  setUntil: (el) => { S.override.until = el.value; save(); render(); },
  walkSet: (el) => { T.walk[el.dataset.arg] = el.value; if (el.dataset.arg === 'grade') { T.walk.cls = ''; T.walk.sid = ''; } if (el.dataset.arg === 'cls') T.walk.sid = ''; render(); },
  setWarn: (el) => { S.settings.warnDays = Number(el.value); save(); render(); },
  statYear: (el) => { T.statYear = Number(el.value); T.statMonth = null; render(); },
  statGrade: (el) => { T.statGrade = el.value; render(); },
  printDate: (el) => { T.printDate = el.value || ymd(now()); render(); },
  symCat: (el) => { S.symCat[el.dataset.arg] = el.value; save(); },
  spSet: (el) => { const k = el.dataset.arg; T.sp[k] = el.value; if (k === 'grade') { T.sp.cls = ''; T.sp.sid = ''; } if (k === 'cls') T.sp.sid = ''; render(); },
  vTime: (el) => { const [vid, k] = el.dataset.arg.split('|'); const v = S.visits.find((x) => x.id === vid); if (!v) return; if (!el.value) { if (k === 'out') { delete v.doneAt; save(); render(); } return; } const [h, m] = el.value.split(':').map(Number); const d = new Date(v.at); d.setHours(h, m, 0, 0); if (k === 'in') v.calledAt = d.getTime(); else v.doneAt = d.getTime(); save(); render(); },
  purCol: (el) => { T.pur.cols[el.dataset.arg] = Number(el.value); buildPurRows(); render(); },
  purHdr: (el) => { T.pur.hdr = Number(el.value); guessPurCols(); buildPurRows(); render(); },
  purMatch: (el) => { const r = T.pur.rows[Number(el.dataset.arg)]; r.match = el.value; const d = S.drugs.find((x) => x.id === el.value); if (d) r.unit = d.unit; render(); },
  purFile: async (el) => { const f = el.files[0]; if (!f) return; try { const aoa = await readTable(f); T.pur = { file: f.name, aoa, hdr: Math.max(0, aoa.findIndex((r) => r.some((c) => /품\s*명|품\s*목|^내\s*용$/.test(String(c).trim())))), cols: {}, rows: [] }; guessPurCols(); buildPurRows(); render(); } catch (e) { toast(e.message || '파일을 읽지 못했어요'); } },
  spFile: async (el) => { const f = el.files[0]; if (!f) return; try { T.spImport = parseSpecial(await readTable(f)); render(); } catch (e) { toast(e.message || '파일을 읽지 못했어요'); } el.value = ''; },
  rosterFile: async (el) => { const f = el.files[0]; if (!f) return; try { T.rosterPreview = parseRoster(await readTable(f)); render(); } catch (e) { toast(e.message || '파일을 읽지 못했어요'); } },
  restore: async (el) => { const f = el.files[0]; if (!f) return; try { const s = JSON.parse(await f.text()); if (!s.school) throw new Error(); const ok = await ask('백업 파일로 되살릴까요?', '연결된 모든 기기의 자료가 백업 파일 내용으로 바뀌어요.', '되살리기', true); if (!ok) return; S = Object.assign(blankState(), s); save(); render(); toast('되살렸어요'); } catch (e) { toast('똑똑! 백업 파일이 아니에요'); } }
};
function guessPurCols() {
  const p = T.pur; const hdr = (p.aoa[p.hdr] || []).map((c) => String(c).replace(/\s/g, ''));
  const saved = S.settings.purMap && S.settings.purMap.hdrText === (p.aoa[p.hdr] || []).join('|') ? S.settings.purMap.cols : null;
  if (saved) { p.cols = { ...saved }; return; }
  const f = (re) => hdr.findIndex((c) => re.test(c));
  p.cols = { name: Math.max(0, f(/품명|품목|물품명|약품명|^내용$/)), spec: f(/규격/), qty: Math.max(0, f(/수량/)) };
}
function syncDraftView() { render(); }

/* ---------- 이벤트 ---------- */
document.addEventListener('click', (e) => {
  if (route() === 'kiosk') ensureAudio();
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName === 'SELECT' || el.type === 'file') return;
  const fn = A[el.dataset.act]; if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el.dataset.arg, el); }
});
document.addEventListener('change', (e) => { const el = e.target; const k = el.dataset && el.dataset.actChange; if (k && CH[k]) CH[k](el); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return; const el = e.target;
  if (e.isComposing || e.keyCode === 229) return; // 한글 입력 중 Enter는 글자 확정이에요
  if (el.dataset && el.dataset.enter && A[el.dataset.enter]) { e.preventDefault(); A[el.dataset.enter](); }
  if (el.id === 'pinIn') A.unlock(); if (el.id === 'setupName') A.setupStart();
});
document.addEventListener('input', (e) => {
  const el = e.target; const d = el.dataset || {};
  if (d.vs) { const [vid, k] = d.vs.split('|'); const v = S.visits.find((x) => x.id === vid); if (v) { v.vs = v.vs || {}; v.vs[k] = el.value; save(); const cell = document.querySelector(`[data-cell="${vid}|vs"]`); if (cell) cell.innerHTML = vsShort(v) ? esc(vsShort(v)) : '<span class="ph">+</span>'; } return; }
  if (d.filter) { const q = el.value.trim(); document.querySelectorAll('[data-frow]').forEach((r) => { r.style.display = !q || r.dataset.frow.includes(q) ? '' : 'none'; }); return; }
  if (d.bindSp) { T.sp[d.bindSp] = el.value; return; }
  if (d.sxp) { const i = d.sxp.indexOf('|'); const v = S.visits.find((x) => x.id === d.sxp.slice(0, i)); if (v) { v.sxp = v.sxp || {}; v.sxp[d.sxp.slice(i + 1)] = el.value; save(); const cell = document.querySelector(`[data-cell="${v.id}|sx"]`); if (cell) cell.querySelectorAll('.cv').forEach((n, k) => { const x = v.sx[k]; if (x && n.firstChild) n.firstChild.textContent = sxLabel(v, x); }); } return; }
  if (d.vmemo) { const v = S.visits.find((x) => x.id === d.vmemo); if (v) { v.memo = el.value; save(); } return; }
  if (d.bindRoot) { T[d.bindRoot] = el.value; if (d.live) render(); return; }
  if (d.bindForm) { T.form[d.bindForm] = el.value; if (d.bindForm === 'drug') render(); return; }
  if (d.bindDrug) { (T.newDrug || T._draft)[d.bindDrug] = el.value; return; }
  if (d.bindPurBuy) { T.pur.buy = el.value; return; }
  if (d.bindPur) { const [i, k] = d.bindPur.split('|'); T.pur.rows[Number(i)][k] = el.value; return; }
  if (d.bindYe) { T.ye[d.bindYe] = el.value; const btn = document.querySelector('[data-act="yeClose"]'); if (btn) btn.disabled = el.value.trim() !== `${S.school.year} 마감`; return; }
  if (d.bindS) { const [a, b] = d.bindS.split('.'); S[a][b] = el.value; save(); return; }
  if (d.bindStudent) { const st = student(d.bindStudent); if (st) { st.note = el.value; save(); } return; }
  if (d.bindSched) { const [wd, key] = d.bindSched.split('|'); S.schedule[wd] = S.schedule[wd] || {}; if (el.value.trim()) S.schedule[wd][key] = el.value.trim(); else delete S.schedule[wd][key]; save(); return; }
  if (d.bindPeriod) { const [i, k] = d.bindPeriod.split('|'); S.periods[Number(i)][k] = el.value; save(); return; }
});
document.addEventListener('change', (e) => { const el = e.target; if (el.dataset && (el.dataset.bindSched || el.dataset.bindForm === 'exp'))  render(); });

/* ---------- 시작 (클라우드 연결 뒤에 시작해요) ---------- */
var BOOTED = false, PENDING_RENDER = false;
const typing = () => { const a = document.activeElement; return !!(a && a.matches && a.matches('input,textarea,select')); };
document.addEventListener('focusout', () => { if (!PENDING_RENDER) return; setTimeout(() => { if (!PENDING_RENDER || typing()) return; PENDING_RENDER = false; render(); }, 60); });
A.demoExit = async () => {
  const ok = await ask('둘러보기를 끝낼까요?', '둘러보기에서 넣은 자료는 모두 지워져요. 끝나면 처음 연결 화면으로 돌아가요.', '끝내기', true);
  if (!ok) return;
  try { localStorage.removeItem('knock.demo'); localStorage.removeItem('knock.demo.v1'); sessionStorage.clear(); } catch (e) {}
  location.replace(location.pathname);
};
window.KNOCK = {
  demo: DEMO,
  getS: () => S,
  setS: (x) => { S = Object.assign(blankState(), x); },
  blankState,
  saveLocal: () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} },
  KEY,
  booted: () => BOOTED,
  boot: () => { if (BOOTED) return; BOOTED = true;
    const strip = (list) => { let n = 0; (list || []).forEach((st) => { if (st.guardians) { delete st.guardians; n++; } }); return n; };
    if (strip(S.roster) + (S.archives || []).reduce((a, ar) => a + strip(ar.roster), 0)) save(); if (!location.hash) location.hash = 'start'; kioskGate(); render(); },
  refresh: () => { if (!BOOTED) return; if (route() !== 'kiosk' && typing()) { PENDING_RENDER = true; return; } if (route() === 'kiosk' && !K.authed) kioskGate(); render(); },
  route, ask, toast, SYMBOL, esc
};
document.getElementById('app').innerHTML = '<div class="wrap" style="max-width:520px"><div class="card" style="margin-top:60px;text-align:center"><p class="muted">연결하는 중…</p></div></div>';
setTimeout(() => { if (!window.CLOUD_LOADED) document.getElementById('app').innerHTML = '<div class="wrap" style="max-width:520px"><div class="card stack" style="margin-top:60px"><h2 style="font-size:20px">화면을 불러오지 못했어요</h2><p class="muted small" style="margin:0">브라우저가 너무 오래됐거나 인터넷 연결이 불안정해요. 최신 크롬·사파리·엣지에서 다시 열어 주세요.</p><button class="btn" onclick="location.reload()">다시 열기</button></div></div>'; }, 20000);
</script>
