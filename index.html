<style>
:root{--teal:#0F766E;--teal-d:#0B5953;--teal-s:#E6F2F0;--ink:#1A2421;--muted:#5B6763;--line:#DCE3E0;--bg:#F5F7F6;--or:#C2410C;--or-d:#9A3412;--or-s:#FDEEE6;--or-l:#F2C9B5;--yel-s:#FFF7E0;--yel-l:#EAD38A;--yel-d:#7A5A00}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--teal)}a:hover{color:var(--teal-d)}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}.small{font-size:14px}.xs{font-size:13px}.b{font-weight:700}
.btn{min-height:44px;padding:0 18px;border-radius:12px;border:0;background:var(--teal);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:hover{background:var(--teal-d);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}.btn.ghost:hover{border-color:#B8C6C1;color:var(--ink)}
.btn.line{background:#fff;color:var(--teal);border:2px solid var(--teal)}
.btn.warn{background:var(--or)}.btn.warn:hover{background:var(--or-d)}
.btn:disabled{background:var(--line);color:var(--muted);cursor:not-allowed;border:0}
.btn.big{min-height:60px;font-size:20px;border-radius:16px}
.link{background:none;border:0;padding:4px 0;color:var(--teal);font-weight:700;cursor:pointer}
.chip{min-height:44px;padding:6px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-align:left}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.drug{color:var(--or-d);border-color:var(--or-l)}.chip.drug.on{background:var(--or);border-color:var(--or);color:#fff}
.chip small{display:block;font-size:12px;font-weight:500;opacity:.85}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px 22px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between}
.check{display:flex;align-items:flex-start;gap:10px;flex-wrap:nowrap;line-height:1.45;cursor:pointer}.check input[type=checkbox]{flex-shrink:0;width:18px;height:18px;margin:2px 0 0;accent-color:var(--teal)}
.tag{display:inline-block;font-size:13px;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.tag.t{background:var(--teal-s);border-color:var(--teal-s);color:var(--teal-d);font-weight:700}
.note{border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}
.note.or{background:var(--or-s);color:var(--or-d)}.note.t{background:var(--teal-s);color:var(--teal-d)}.note.g{background:var(--bg)}.note.y{background:var(--yel-s);color:var(--yel-d);border:1px solid var(--yel-l)}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=password],select,textarea{height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;background:#fff;min-width:0}
textarea{height:auto;padding:10px 12px;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink);font-size:16px}
table.t{width:100%;border-collapse:collapse;font-size:14px}

table.t td{padding:9px 8px;border-bottom:1px solid #EEF2F0;vertical-align:top}
.scroll{overflow-x:auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}.tile .v{font-size:26px;font-weight:700}

.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:20px;text-decoration:none;color:var(--ink)}
.nav{display:flex;flex-wrap:wrap;gap:4px;font-size:15px}
.nav a{padding:8px 12px;border-radius:10px;color:var(--ink);text-decoration:none}

.wrap{max-width:1600px;margin:0 auto;padding:22px 24px 60px}

.c-q{flex:1 1 260px;min-width:0}.c-w{flex:999 1 560px;min-width:0}.c-h{flex:1 1 280px;min-width:0}
.qcard{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;width:100%}
.qcard.cur{border-color:var(--teal)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:20px;font-weight:700;cursor:pointer}
.banner{background:var(--yel-s);border-bottom:1px solid var(--yel-l);color:var(--yel-d);font-size:14px;text-align:center;padding:6px 12px}

.k-steps{display:flex;gap:26px;font-size:16px}.k-steps span{padding:6px 0;color:var(--muted)}.k-steps span.on{color:var(--teal);font-weight:700;border-bottom:3px solid var(--teal)}
.k-main{flex:1;display:flex;gap:28px;padding:26px 32px;min-height:0}
.k-foot{display:flex;justify-content:flex-end;gap:14px;padding:0 32px 10px;font-size:13px}
.k-foot button{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px}

.kbtn.on{background:var(--teal);border-color:var(--teal);color:#fff}
.knum{height:84px;border-radius:14px;cursor:pointer;background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}

.knum.on{background:var(--teal);border-color:var(--teal);color:#fff}
.body{position:relative;width:230px;height:525px}
.part{position:absolute;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1;background:#D5DDDA;color:#3F4A47}
.part.on{background:var(--teal);color:#fff}
.call{min-height:100vh;background:var(--teal);color:#fff;display:flex;flex-direction:column;padding:36px 52px}
/* 마우스 올렸을 때 */

  .chip.drug:not(.on):hover{border-color:var(--or);background:var(--or-s)}
  .chip.drug.on:hover{background:var(--or-d);border-color:var(--or-d)}
  .kbtn:not(.on):not(:disabled):hover,.knum:not(.on):hover{border-color:#8FBFB7;background:var(--teal-s)}
  .kbtn.on:hover,.knum.on:hover{background:var(--teal-d);border-color:var(--teal-d)}
  .part:not(.on):hover{background:#BCC9C5;color:var(--ink)}
  .part.on:hover{background:var(--teal-d)}
  .qcard:not(.cur):hover{border-color:#8FBFB7;box-shadow:0 2px 10px rgba(26,36,33,.07)}
  .nav a:not(.on):hover{background:var(--bg);color:var(--ink)}
  .link:hover{text-decoration:underline;text-underline-offset:3px}
  .stepper button:hover{border-color:#8FBFB7;background:var(--teal-s)}
  .k-foot button:hover{color:var(--ink)}

  [data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;font-weight:500;line-height:1.4;padding:6px 10px;border-radius:8px;white-space:nowrap;z-index:40;pointer-events:none;text-align:left}
  [data-tip-pos=bottom]:hover::after{bottom:auto;top:calc(100% + 8px)}
  [data-tip-pos=left]:hover::after{left:auto;right:0;transform:none}
}

@media print{.noprint{display:none!important}body,html{background:#fff}.wrap{padding:0;max-width:none}.card{border:0;padding:0}}
@page{size:A4 landscape;margin:12mm}
.printsheet{background:#fff;color:#111}
.printsheet table{width:100%;border-collapse:collapse;font-size:13px;line-height:1.4}
.printsheet th,.printsheet td{border:1px solid #555;padding:6px 5px}
.printsheet th{background:#EEF2F0}
.modalbg{position:fixed;inset:0;background:rgba(26,36,33,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:18px;padding:22px 24px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:60}
.heat td{text-align:center;border-radius:4px;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:130px minmax(0,1fr) 56px;align-items:center;gap:10px;font-size:14px}
.bar .tr{height:14px;background:#EEF2F0;border-radius:0 4px 4px 0}.bar .fl{height:14px;background:var(--teal);border-radius:0 4px 4px 0}

function yearData(y) {
  if (Number(y) === S.school.year) return { visits: S.visits.filter((v) => v.status === 'done'), roster: S.roster };
  const ar = S.archives.find((a) => a.year === Number(y)); return ar ? { visits: ar.visits.filter((v) => v.status === 'done'), roster: ar.roster } : { visits: [], roster: [] };
}
const MONTHS = ['3월', '4월', '5월', '6월', '7월', '8월', '9월', '10월', '11월', '12월', '1월', '2월'];
const mIndex = (t) => (new Date(t).getMonth() + 10) % 12;
function statsOf(y, grade) {
  const { visits } = yearData(y);
  const vs = visits.filter((v) => grade === 'all' || String((v.snap || {}).grade) === String(grade));
  const mat = Object.fromEntries(CATS.map((c) => [c, Array(12).fill(0)]));
  const monthTot = Array(12).fill(0); const symByMonth = Array(12).fill(0).map(() => ({}));
  const care = {}; const grades = {};
  vs.forEach((v) => {
    const mi = mIndex(v.at); const cat = S.symCat[(v.sym || [])[0]] || '기타';
    mat[cat][mi]++; monthTot[mi]++;
    (v.sym || []).forEach((s) => { symByMonth[mi][s] = (symByMonth[mi][s] || 0) + 1; });
    [...(v.cares || []), ...(v.custom || [])].forEach((c) => { care[c] = (care[c] || 0) + 1; });
    if ((v.drugs || []).length) care['투약'] = (care['투약'] || 0) + 1;
    const g = (v.snap || {}).grade; if (g) grades[g] = (grades[g] || 0) + 1;
  });
  return { vs, mat, monthTot, symByMonth, care, grades };
}

  if (d.bindS) { const [a, b] = d.bindS.split('.'); S[a][b] = el.value; save(); return; }
  if (d.bindStudent) { const st = student(d.bindStudent); if (st) { st.note = el.value; save(); } return; }
  if (d.bindSched) { const [wd, key] = d.bindSched.split('|'); S.schedule[wd] = S.schedule[wd] || {}; if (el.value.trim()) S.schedule[wd][key] = el.value.trim(); else delete S.schedule[wd][key]; save(); return; }
  if (d.bindPeriod) { const [i, k] = d.bindPeriod.split('|'); S.periods[Number(i)][k] = el.value; save(); return; }
});
document.addEventListener('change', (e) => { const el = e.target; if (el.dataset && (el.dataset.bindSched || el.dataset.bindForm === 'exp'))  render(); });

/* ---------- 시작 (클라우드 연결 뒤에 시작해요) ---------- */
let BOOTED = false, PENDING_RENDER = false;
const typing = () => { const a = document.activeElement; return !!(a && a.matches && a.matches('input,textarea,select')); };
document.addEventListener('focusout', () => { if (!PENDING_RENDER) return; setTimeout(() => { if (!PENDING_RENDER || typing()) return; PENDING_RENDER = false; render(); }, 60); });
window.KNOCK = {
  getS: () => S,
  setS: (x) => { S = Object.assign(blankState(), x); },
  blankState,
  saveLocal: () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} },
  KEY,
  booted: () => BOOTED,
  boot: () => { if (BOOTED) return; BOOTED = true; if (!location.hash) location.hash = 'start'; kioskGate(); render(); },
  refresh: () => { if (!BOOTED) return; if (route() !== 'kiosk' && typing()) { PENDING_RENDER = true; return; } if (route() === 'kiosk' && !K.authed) kioskGate(); render(); },
  route, ask, toast, SYMBOL, esc
};
document.getElementById('app').innerHTML = '<div class="wrap" style="max-width:520px"><div class="card" style="margin-top:60px;text-align:center"><p class="muted">연결하는 중…</p></div></div>';
setTimeout(() => { if (!window.CLOUD_LOADED) document.getElementById('app').innerHTML = '<div class="wrap" style="max-width:520px"><div class="card stack" style="margin-top:60px"><h2 style="font-size:20px">화면을 불러오지 못했어요</h2><p class="muted small" style="margin:0">브라우저가 너무 오래됐거나 인터넷 연결이 불안정해요. 최신 크롬·사파리·엣지에서 다시 열어 주세요.</p><button class="btn" onclick="location.reload()">다시 열기</button></div></div>'; }, 20000);
</script>
